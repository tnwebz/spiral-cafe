<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spiral Cafe POS · Offline</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #FFF9F5;
      color: #2C1710;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #FFFFFF;
      border: 1px solid rgba(202, 52, 10, 0.15);
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.04), 0 1px 3px rgba(0, 0, 0, 0.02);
    }
    .logo {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      margin-bottom: 24px;
      box-shadow: 0 8px 16px rgba(202, 52, 10, 0.12);
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      color: #2C1710;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 9999px;
      background: #FEF3C7;
      color: #92400E;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 16px;
    }
    p {
      font-size: 14px;
      line-height: 1.5;
      color: #71717A;
      margin-bottom: 28px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 14px 24px;
      background: #CA340A;
      color: #FFFFFF;
      font-size: 14px;
      font-weight: 700;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(202, 52, 10, 0.25);
      transition: all 0.2s ease;
      text-decoration: none;
    }
    .btn:hover {
      background: #A82806;
      transform: translateY(-1px);
    }
    .info {
      margin-top: 20px;
      font-size: 12px;
      color: #A1A1AA;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192x192.png" alt="Spiral Cafe POS" class="logo" />
    <div>
      <span class="badge">Connection Required</span>
    </div>
    <h1>Internet Connection Unavailable</h1>
    <p>
      Spiral Cafe POS operates with real-time cloud database synchronization. Please check your Wi-Fi or router connection and retry.
    </p>
    <button class="btn" onclick="window.location.reload()">
      Retry Connection
    </button>
    <div class="info">
      Local Print Connector on 127.0.0.1:4318 remains operational.
    </div>
  </div>
</body>
</html>
